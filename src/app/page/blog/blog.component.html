<div class="p-3 flex gap-3" style="background-color: var(--primary-app-background);">
  <app-menu-left></app-menu-left>

  <div>
    <h2 class="header-component">Quản lý bài viết</h2>
    <p-table #dt1 [value]="listBlog" dataKey="id" [rows]="10" [showCurrentPageReport]="true"
      [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading" [paginator]="true" [tableStyle]="{'min-width': '50rem'}"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [globalFilterFields]="['title', 'keyword', 'username', 'createdAt', 'status']" styleClass="p-datatable-sm">
      <ng-template pTemplate="caption">
        <div class="flex gap-3">
          <button pButton label="Add" class="p-button-outlined" icon="fa-solid fa-plus"
            (click)="onShowDialog(SYSTEM_ACTION.CREATE, {})"></button>
          <button pButton label="Clear" class="p-button-outlined" icon="pi pi-filter-slash"
            (click)="clear(dt1)"></button>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Tiêu đề
              <p-columnFilter type="text" field="title" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Từ khóa
              <p-columnFilter type="text" field="keyword" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Người tạo
              <p-columnFilter type="text" field="username" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Ngày tạo
              <p-columnFilter type="text" field="createdAt" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Trạng thái
              <p-columnFilter type="text" field="status" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Thao tác
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>
            <span class="vertical-align-middle">{{ item.title }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ item.keyword }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ item.email || item.username || '...' }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ item.createdAt | date:'HH:mm:ss dd/MM/yyyy' }}</span>
          </td>
          <td>
            <span class="vertical-align-middle
              {{ item.status === BLOG_STATUS[0].CODE ? 'text-red-500' : 'text-green-500'}}"> {{ item.status |
              DynamicPipe: BLOG_STATUS }}
            </span>
          </td>
          <td>
            <div class="flex align-items-center gap-2">
              <i class="text-xl icon fa-solid fa-eye" pTooltip="Xem chi tiết"
                (click)="onShowDialog(SYSTEM_ACTION.VIEW, item)"></i>
              <i class="text-xl icon fa-solid fa-pen-to-square" pTooltip="Chỉnh sửa bài viết"
                (click)="onShowDialog(SYSTEM_ACTION.UPDATE, item)"></i>
              <i class="text-xl icon fa-solid fa-trash-can" pTooltip="Xóa bài viết"
                (click)="confirmDelete($event, item)"></i>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td class="text-center" colspan="6">No blogs found.</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody" let-columns="columns">
        <tr style="height:46px">
          <td *ngFor="let col of columns; let even = even">
            <p-skeleton [ngStyle]="{'width': even ? (col.field === 'year' ? '30%' : '40%') : '60%'}"></p-skeleton>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>
  <app-blog-dialog [visible]="visible" [data]="dataDialog" (visibleChange)="handleVisibleChange($event)">
  </app-blog-dialog>
</div>
