<div class="p-3 flex gap-3" style="background-color: var(--primary-app-background);">
  <app-admin-menu-left></app-admin-menu-left>

  <div>
    <h2 class="header-component">Quản lý gói dịch vụ</h2>
    <p-table #dt1 [value]="listServicePack" dataKey="id" [rows]="10" [showCurrentPageReport]="true"
      [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading" [paginator]="true" [tableStyle]="{'min-width': '50rem'}"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" styleClass="p-datatable-sm">
      <ng-template pTemplate="caption">
        <div class="flex gap-3">
          <button pButton label="Add" class="p-button-outlined" icon="fa-solid fa-plus"
            (click)="onShowDialog(SYSTEM_ACTION.CREATE, {})"></button>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th class="w-15rem">
            <div class="flex align-items-center">
              Tên gói dịch vụ
            </div>
          </th>
          <th class="w-15rem">
            <div class="flex align-items-center">
              Mô tả
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Khuyến mãi
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Giá cước
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Hết hạn
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Thao tác
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-service>
        <tr>
          <td class="flex align-items-center gap-3">
            <p-avatar image="{{ pathEnvironment + '/' + service.image }}" styleClass="mr-2" size="large"
              shape="circle"></p-avatar>
            <span class="vertical-align-middle">{{ service.servicePackName }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ service.content }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ service.promotion | number:'1.0-0' }}%</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ service.price | number:'1.0-0' }} VNĐ</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ service.expirationDate | number:'1.0-0' }} ngày</span>
          </td>
          <td>
            <div class="flex align-items-center gap-2">
              <i class="text-xl icon fa-solid fa-eye" (click)="onShowDialog(SYSTEM_ACTION.VIEW, service)"></i>
              <i class="text-xl icon fa-solid fa-pen-to-square"
                (click)="onShowDialog(SYSTEM_ACTION.UPDATE, service)"></i>
              <i class="text-xl icon fa-solid fa-trash-can" (click)="confirmDelete($event, service)"></i>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td class="text-center" colspan="6">No users found.</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody" let-columns="columns">
        <tr style="height:46px">
          <td *ngFor="let col of columns; let even = even">
            <p-skeleton [ngStyle]="{'width': even ? (col.field === 'year' ? '30%' : '40%') : '60%'}"></p-skeleton>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>
  <app-admin-service-pack-dialog [visible]="visible" [data]="dataDialog" (visibleChange)="handleVisibleChange($event)">
  </app-admin-service-pack-dialog>
</div>
