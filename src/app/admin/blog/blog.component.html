<div class="p-3 flex gap-3" style="background-color: var(--primary-app-background);">
  <app-admin-menu-left></app-admin-menu-left>

  <div>
    <p-table #dt1 [value]="listBlog" dataKey="id" [rows]="10" [showCurrentPageReport]="true"
             [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading" [paginator]="true"
             [tableStyle]="{'min-width': '50rem'}"
             currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
             [globalFilterFields]="['title', 'keyword', 'username', 'createdAt', 'status']" styleClass="p-datatable-sm">
      <ng-template pTemplate="caption">
        <div class="flex gap-3">
          <button pButton label="Add" class="p-button-outlined" icon="fa-solid fa-plus"
                  (click)="onShowDialog(SYSTEM_ACTION.CREATE, {})"></button>
          <button pButton label="Clear" class="p-button-outlined" icon="pi pi-filter-slash"
                  (click)="clear(dt1)"></button>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Tiêu đề
              <p-columnFilter type="text" field="title" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Từ khóa
              <p-columnFilter type="text" field="keyword" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Người tạo
              <p-columnFilter type="text" field="username" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Ngày tạo
              <p-columnFilter type="text" field="createdAt" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Trạng thái
              <p-columnFilter type="text" field="status" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Thao tác
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-blog>
        <tr>
          <td>
            <span class="vertical-align-middle">{{ blog.title }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ blog.keyword }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ blog.username }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ blog.createdAt | date:'HH:mm:ss dd/MM/yyyy' }}</span>
          </td>
          <td>
            <span class="vertical-align-middle
              {{ blog.status === BLOG_STATUS.PENDING ? 'text-green-500' : 'text-red-500'}}"> {{ blog.status }}
            </span>
          </td>
          <td>
            <div class="flex align-items-center gap-2">
              <i class="text-xl fa-solid fa-eye" (click)="onShowDialog(SYSTEM_ACTION.VIEW, blog)"></i>
              <i class="text-xl fa-solid fa-pen-to-square" (click)="onShowDialog(SYSTEM_ACTION.UPDATE, blog)"></i>
              <i class="text-xl fa-solid fa-trash-can" (click)="confirmDelete($event, blog)"></i>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td class="text-center" colspan="6">No blogs found.</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody" let-columns="columns">
        <tr style="height:46px">
          <td *ngFor="let col of columns; let even = even">
            <p-skeleton [ngStyle]="{'width': even ? (col.field === 'year' ? '30%' : '40%') : '60%'}"></p-skeleton>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>
  <app-admin-blog-dialog [visible]="visible" [data]="dataDialog" (visibleChange)="handleVisibleChange($event)">
  </app-admin-blog-dialog>
</div>
