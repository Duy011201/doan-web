<div class="p-3 flex gap-3" style="background-color: var(--primary-app-background);">
  <app-admin-menu-left></app-admin-menu-left>

  <div>
    <p-table #dt1 [value]="listCompany" dataKey="id" [rows]="10" [showCurrentPageReport]="true"
             [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading" [paginator]="true"
             [tableStyle]="{'min-width': '50rem'}"
             currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
             [globalFilterFields]="['companyName', 'email', 'province', 'field', 'status']" styleClass="p-datatable-sm">
      <ng-template pTemplate="caption">
        <div class="flex gap-3">
          <button pButton label="Add" class="p-button-outlined" icon="fa-solid fa-plus"
                  (click)="onShowDialog(SYSTEM_ACTION.CREATE, {})"></button>
          <button pButton label="Clear" class="p-button-outlined" icon="pi pi-filter-slash"
                  (click)="clear(dt1)"></button>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th class="w-17rem">
            <div class="flex align-items-center">
              Tên công ty
              <p-columnFilter type="text" field="companyName" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Email
              <p-columnFilter type="text" field="email" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Tỉnh
              <p-columnFilter type="text" field="province" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Lĩnh vực
              <p-columnFilter type="text" field="field" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Trạng thái
              <p-columnFilter type="text" field="status" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-10rem">
            <div class="flex align-items-center">
              Thao tác
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-company>
        <tr>
          <td class="flex align-items-center gap-3">
            <p-avatar
              image="{{ pathEnvironment + '/' + company.logo }}"
              styleClass="mr-2"
              size="large"
              shape="circle"></p-avatar>
            <span class="vertical-align-middle">{{ company.name ? company.name : '...' }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ company.email }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ company.province ? company.province : '...' }}</span>
          </td>
          <td>
            <span class="vertical-align-middle">{{ company.field ? company.field : '...' }}</span>
          </td>
          <td>
            <span class="vertical-align-middle
              {{ company.status === SYSTEM_STATUS.ACTIVE ? 'text-green-500' : 'text-red-500'}}"> {{ company.status }}
            </span>
          </td>
          <td>
            <div class="flex align-items-center gap-2">
              <i class="text-xl fa-solid fa-eye" (click)="onShowDialog(SYSTEM_ACTION.VIEW, company)"></i>
              <i class="text-xl fa-solid fa-pen-to-square" (click)="onShowDialog(SYSTEM_ACTION.UPDATE, company)"></i>
              <i class="text-xl fa-solid fa-trash-can" (click)="confirmDelete($event, company)"></i>
              <i class="text-xl fa-solid fa-lock" (click)="confirmLock($event, company)"></i>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td class="text-center" colspan="6">No users found.</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody" let-columns="columns">
        <tr style="height:46px">
          <td *ngFor="let col of columns; let even = even">
            <p-skeleton [ngStyle]="{'width': even ? (col.field === 'year' ? '30%' : '40%') : '60%'}"></p-skeleton>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>
  <app-admin-company-dialog [visible]="visible" [data]="dataDialog" (visibleChange)="handleVisibleChange($event)">
  </app-admin-company-dialog>
</div>
