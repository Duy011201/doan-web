<div class="p-3 flex gap-3" style="background-color: var(--primary-app-background);">
  <app-admin-menu-left></app-admin-menu-left>

  <div>
    <p-table #dt1 [value]="customers" dataKey="id" [rows]="10" [showCurrentPageReport]="true"
      [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading" [paginator]="true" [tableStyle]="{'min-width': '50rem'}"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [globalFilterFields]="['name', 'country.name', 'representative.name', 'status']" styleClass="p-datatable-sm">
      <ng-template pTemplate="caption">
        <div class="flex">
          <button pButton label="Clear" class="p-button-outlined" icon="fa-solid fa-plus" (click)="clear(dt1)"></button>

          <button pButton label="Clear" class="p-button-outlined" icon="pi pi-filter-slash"
            (click)="clear(dt1)"></button>
          <button pButton label="Clear" class="p-button-outlined" icon="pi pi-filter-slash"
            (click)="clear(dt1)"></button>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th class="w-15rem">
            <div class="flex align-items-center">
              Username
              <p-columnFilter type="text" field="name" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Avatar
              <p-columnFilter type="text" field="country.name" display="menu"></p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Email
              <p-columnFilter field="representative" matchMode="in" display="menu" [showMatchModes]="false"
                [showOperator]="false" [showAddButton]="false">
                <ng-template pTemplate="header">
                  <div class="px-3 pt-3 pb-0">
                    <span class="font-bold">Agent Picker</span>
                  </div>
                </ng-template>
                <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                  <p-multiSelect [ngModel]="value" placeholder="Any" (onChange)="filter($event.value)"
                    optionLabel="name">
                    <ng-template let-option pTemplate="item">
                      <div class="inline-block vertical-align-middle">
                        <img [alt]="option.label"
                          src="https://primefaces.org/cdn/primeng/images/demo/avatar/{{ option.image }}" width="24"
                          class="vertical-align-middle" />
                        <span class="ml-1 mt-1">{{ option.name }}</span>
                      </div>
                    </ng-template>
                  </p-multiSelect>
                </ng-template>
              </p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Phone
              <p-columnFilter field="status" matchMode="equals" display="menu">
                <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                  <p-dropdown [ngModel]="value" (onChange)="filter($event.value)" placeholder="Any">
                    <ng-template let-option pTemplate="item">
                      <p>aaa</p>
                    </ng-template>
                  </p-dropdown>
                </ng-template>
              </p-columnFilter>
            </div>
          </th>
          <th class="w-12rem">
            <div class="flex align-items-center">
              Status
              <p-columnFilter field="status" matchMode="equals" display="menu">
                <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                  <p-dropdown [ngModel]="value" (onChange)="filter($event.value)" placeholder="Any">
                    <ng-template let-option pTemplate="item">
                      <p>aaa</p>
                    </ng-template>
                  </p-dropdown>
                </ng-template>
              </p-columnFilter>
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-customer>
        <tr>
          <td>
            {{ customer.name }}
          </td>
          <td>
            <img src="https://primefaces.org/cdn/primeng/images/demo/flag/flag_placeholder.png"
              [class]="'flag flag-' + customer.country.code" style="width: 20px" />
            <span class="ml-1 vertical-align-middle">{{ customer.country.name }}</span>
          </td>
          <td>
            <img [alt]="customer.representative.name"
              src="https://primefaces.org/cdn/primeng/images/demo/avatar/{{ customer.representative.image }}" width="32"
              style="vertical-align: middle" />
            <span class="ml-1 vertical-align-middle">{{ customer.representative.name }}</span>
          </td>
          <td>
            {{ customer.date | date: 'MM/dd/yyyy' }}
          </td>
          <td>
            <p-progressBar [value]="customer.activity" [showValue]="false"></p-progressBar>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7">No customers found.</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody" let-columns="columns">
        <tr style="height:46px">
          <td *ngFor="let col of columns; let even = even">
            <p-skeleton [ngStyle]="{'width': even ? (col.field === 'year' ? '30%' : '40%') : '60%'}"></p-skeleton>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
